<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            margin-top: 100px;
            
        }   
        div {
            background-color: white;
            height: 350px;
            width: 300px;
            border-radius: 10px;
            padding: 20px;
        }
        .card {
            margin-top: 0;
        }
        h1 {
            margin-bottom: 5px;
        }
        h3 {
            margin-bottom: 5px;
        }
        input {
            width: 300px;
            height: 25px;
            border-radius: 5px;
            border: 1px solid lightgray;
        }
        input:hover {
            border: 2px solid black;
            }
        button {
            height: 25px;
            width: 310px;
            text-align: justify;
            background-color: rgb(9, 79, 9);
            color: white;
            border-radius: 5px;
        }
        .cards {
            text-align: center;
        }
    </style>
    
</head>
<body>
    <div>
        <h1>Welcome Back</h1>
        <p class="card">Log in to your account</p>
        <form action="submit.js">
            <h3>Email</h3>
            <input type="email" placeholder="Email">
            <h3>Your password</h3>
            <input type="password" placeholder="Your password">
        </form><br>
        <button>Log in</button><br><br>
        <p class="cards">Don't have an account? <span style="color: green;">Sign up!</span></p>
    </div>
    
</body>
</html>
