<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUSH STORE | Premium Fashion</title>
    <style>
        * {
            margin: o;
            padding: o;
            box-sizing: border-box;
        }
        
        .head-top {
            background-color: black;
            display: flex;
            height: 35px;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .head-bot  {
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            padding-left: 20px;
            padding-right: 20px;
            box-shadow: 1px,2px,3px rgb(0,0,0,0.2);

        }
        .left {
            display: flex;
            gap: 4px;
        }
        .right{
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .luxe {
            font-size: 2.5rem;

        }
        .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background-color: orange;
            margin-top: 32px;
        
        }
        nav {
            display: flex;
        
            align-items: center;
            gap: 30px;
        }
        
        nav a {
            text-decoration: none;
            color: black;
        } 
        nav a:hover {
            color: blue;
        }
        .hero {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, .12)),
            url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1800') center/cover no-repeat;
            min-height: 600px;
            padding-left: 30px;
            padding-top: 30px;
        }
        .big {
            font-size: 5rem;
            color: white;
        }
        .big2 {
            font-size: 1.5rem;
            color: goldenrod;
            margin-top: 10%;
        }
        .big3 {
            font-size: 1.5rem;
            color: white;

        }
        h2 {
            margin: 0;
        }
        .herobut {
            background-color: goldenrod;
            height: 50px;
            width: 300px;
            color: white;
            border: 0;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
    </style>
</head>
<body>
    <header>
        <div class="head-top">FREE SHIPPING ON ORDERS ABOVE #100,000</div>

        <div class="head-bot">
            <div class="left">
                <div class="luxe">LUXE</div>
                <div class="dot"></div>

            </div>
            <nav>
                <a href="#home">Home</a>
                <a href="#shop">Shop</a>
                <a href="#categories">Categories</a>
                <a href="#about">About</a>
            </nav>

            <div class="right">
                <div>uj</div>
                <div>hjkjh</div>
                <div>j</div>
            </div>

        </div>

    </header>
    <div class="hero">
        <p class="big2">NEW COLLECTION</p>
        <h2 class="big">Style that <br>speaks for you.</h2>
        <p class="big3">Discover timeless fashion pieces designed to <br>make every moment unforgettable</p>
        <button class="herobut">SHOP COLLECTION→</button>

    </div>
    <section id="Categories">
        <div class="section2">
        <p>EXPLORE OUR STORE</p>
             
        </div>
    </section>
    
</body>
</html>
